<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprout Pitch Deck</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="deck.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<div id="stage"><div id="slide" class="slide"></div></div>
<div id="wipe"><svg class="wave" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 60 Q180 0 360 60 T720 60 T1080 60 T1440 60 V120 H0Z"/></svg><div id="wipe-label"></div></div>
<div id="print-pages"></div>
<div id="toast" role="status"></div>

<nav id="toolbar" aria-label="Slideshow controls">
  <div id="progress"></div>
  <div class="tb-left">
    <button id="btn-menu" class="tb" title="Menu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <span id="stage-name"></span>
    <span id="steps"></span>
  </div>
  <div class="tb-mid">
    <button id="btn-prev" class="tb" title="Back (←)" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="counter">1 / 1</span>
    <button id="btn-next" class="tb" title="Next (→ or space)" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="tb-right">
    <span id="timer">0:00 / 20:00</span>
    <button id="btn-order" class="tb wide" title="Reload Order #1 (R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg><span>Reload order</span></button>
    <button id="btn-mute" class="tb" title="Sound (M)" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path class="wave1" d="M16 9a4 4 0 0 1 0 6"/></svg></button>
    <button id="btn-grid" class="tb" title="All slides (G)" aria-label="Slide grid"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></button>
    <button id="btn-full" class="tb" title="Fullscreen (F)" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
  <div id="menu" class="menu" role="menu">
    <button data-act="pdf">Export as PDF</button>
    <button data-act="pptx">Export as PPTX or video</button>
    <button data-act="html">Share as HTML</button>
    <hr>
    <button data-act="notes">Speaker notes <kbd>N</kbd></button>
    <button data-act="order">Enter order by hand <kbd>O</kbd></button>
    <button data-act="keys">Keyboard shortcuts <kbd>?</kbd></button>
    <button data-act="restart">Restart from slide 1</button>
    <button data-act="home">Back to home page</button>
  </div>
</nav>

<div id="grid"><div class="grid-head"><h2>All slides</h2><button class="tb close-grid" onclick="this.closest('#grid').classList.remove('open')">Close</button></div><div id="grid-list"></div></div>
<aside id="notes" class="panel"><button class="close">Close</button><div id="notes-body"></div></aside>
<aside id="order-panel" class="panel"><button class="close">Close</button><h3>Enter Order #1 by hand</h3><div id="order-panel-body"></div></aside>
<aside id="keys" class="panel"><button class="close">Close</button><h3>Keyboard</h3>
  <p><kbd>→</kbd> <kbd>space</kbd> next · <kbd>←</kbd> back · <kbd>F</kbd> fullscreen · <kbd>R</kbd> reload order · <kbd>M</kbd> sound · <kbd>G</kbd> all slides · <kbd>N</kbd> notes · <kbd>O</kbd> enter order · <kbd>Home</kbd>/<kbd>End</kbd></p>
  <p>Clicking the slide also goes to the next step. A presentation clicker works too (it sends Page Down).</p></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="../content/brand.js"></script>
<script src="../content/menu.js"></script>
<script src="../content/data.js"></script>
<script src="../content/places.js"></script>
<script src="../shared/art.js"></script>
<script src="../shared/orders.js"></script>
<script src="audio.js"></script>
<script src="engine.js"></script>
<script src="slides/kit.js"></script>
<!-- One file per story stage. Add slides by copying a Deck.add({...}) block. -->
<script src="slides/01-plant.js"></script>
<script src="slides/02-water.js"></script>
<script src="slides/03-harvest.js"></script>
<script src="slides/04-place.js"></script>
<script src="slides/04-blend.js"></script>
<script src="slides/05-pour.js"></script>
<script src="slides/06-serve.js"></script>
<script src="slides/07-cheers.js"></script>
<script>Deck.start();</script>
</body>
</html>
