<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CUE</title>
<link rel="stylesheet" href="shared/base.css">
<style>
html, body { min-height: 100%; overflow-x: hidden; }
body { background: radial-gradient(80% 60% at 15% 0, #FFD9A8 0, transparent 60%), radial-gradient(70% 60% at 95% 100%, #FFC4CF 0, transparent 60%), var(--cream); }
.hub { position: relative; min-height: 100vh; min-height: 100dvh; padding: 32px 16px 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; isolation: isolate; overflow: hidden; }
.bg { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
.bg .blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .55; animation: float 14s ease-in-out infinite; }
.bg .fr { position: absolute; font-size: 56px; opacity: .8; animation: float 11s ease-in-out infinite; filter: drop-shadow(0 8px 6px rgba(37, 41, 43,.12)); }
@keyframes float { 0%,100% { transform: translate(0,0) rotate(-6deg); } 50% { transform: translate(14px,-30px) rotate(8deg); } }
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.mo { width: clamp(120px, 22vw, 180px); animation: bob 2.8s ease-in-out infinite; transform-origin: 50% 100%; }
.mo svg { width: 100%; height: auto; overflow: visible; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
h1.logo { font-size: clamp(64px, 17vw, 168px); font-weight: 900; font-variation-settings: "opsz" 144; color: var(--mango); line-height: .9; text-shadow: 0 5px 0 #A8622B, 0 12px 24px rgba(199,96,10,.3); letter-spacing: -0.03em; }
h1.logo i { color: var(--leaf); font-style: italic; }
.logo-sticker { height: clamp(190px, 34vw, 330px); width: auto; display: block; margin: 0 auto;
  filter: drop-shadow(0 14px 22px rgba(37, 41, 43,.28)); }
.logo-text { display: none; }
h1.logo.txt .logo-sticker { display: none; }
h1.logo.txt .logo-text { display: inline; }
.logo-text i { color: var(--leaf); font-style: italic; }
.slogan { font: italic 500 clamp(18px, 3.4vw, 28px) var(--font-display); color: var(--soil); margin: .55em 0 0; }
.doors { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; width: 100%; max-width: 980px; perspective: 900px; }
.door { display: flex; flex-direction: column; gap: 10px; padding: 24px 22px; border-radius: 26px; background: var(--white); color: var(--ink); text-decoration: none; box-shadow: 0 5px 0 rgba(37, 41, 43,.14), var(--shadow); border: 3px solid var(--ink); position: relative; overflow: hidden;
  transition: transform .18s ease-out, box-shadow .2s; transform-style: preserve-3d; min-height: 190px; }
.door:hover, .door:focus-visible { box-shadow: 0 14px 0 rgba(37, 41, 43,.14), 0 24px 40px rgba(37, 41, 43,.22); outline: none; }
.door .ic { font-size: 42px; line-height: 1; }
.door h2 { font-size: 28px; }
.door p { margin: 0; color: var(--ink-soft); font-size: 15px; }
.door .go { margin-top: auto; font-weight: 700; color: var(--white); background: var(--mango); align-self: flex-start; padding: .5em 1.1em; border-radius: 999px; box-shadow: 0 4px 0 #A8622B; }
.door.d2 .go { background: var(--leaf); box-shadow: 0 4px 0 var(--leaf-dark); }
.door.d3 .go { background: var(--berry); box-shadow: 0 4px 0 #5E2431; }
.door::after { content: ""; position: absolute; right: -40px; top: -40px; width: 120px; height: 120px; border-radius: 50%; background: var(--mango-soft); opacity: .6; z-index: 0; }
.door.d2::after { background: #BFE8B7; } .door.d3::after { background: #F7B9C6; }
.door > * { position: relative; z-index: 1; }
.qr { display: none; align-items: center; gap: 12px; }
.qr.on { display: flex; }
.qr #qr svg, .qr #qr img { width: 96px; height: 96px; display: block; border-radius: 8px; }
.qr small { font-size: 12px; color: var(--ink-soft); font-weight: 500; line-height: 1.3; }
@media (max-width: 800px) { .doors { grid-template-columns: 1fr; max-width: 460px; } .door { min-height: 0; } .door .go { margin-top: 6px; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="hub">
  <div class="bg" id="bg" aria-hidden="true"></div>
  <header class="hero">
    <div class="mo" id="mo"></div>
    <h1 class="logo display" id="logo">
      <img class="logo-sticker" src="assets/img/cue-logo.png"
           alt="CUE logo — a cream smoothie cup with striped straw and sparkles on a dark charcoal oval sticker"
           onerror="this.parentNode.classList.add('txt')">
      <span class="logo-text" id="logoText"></span>
    </h1>
    <p class="slogan" id="slogan"></p>
  </header>
  <nav class="doors">
    <a class="door d1" href="site/index.html"><span class="ic">🥭</span><h2 class="display">View website</h2><p>The launch page: menu, survey stats, where to find us.</p><span class="go">Open &rarr;</span></a>
    <a class="door d2" href="order/index.html"><span class="ic">📱</span><h2 class="display">Order on your phone</h2><p>Build a smoothie in six taps and get a pickup ticket.</p>
      <div class="qr" id="qrBox"><div id="qr"></div><small>Scan to order<br>from your phone</small></div><span class="go">Open &rarr;</span></a>
    <a class="door d3" href="deck/index.html"><span class="ic">🎤</span><h2 class="display">View pitch</h2><p>The animated pitch deck, from seed to cup.</p><span class="go">Open &rarr;</span></a>
  </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="content/brand.js"></script>
<script src="content/menu.js"></script>
<script src="shared/art.js"></script>
<script>
(function () {
  var B = window.CONTENT.brand;
  document.title = B.name + " - " + B.slogan;
  var n = B.name;
  document.getElementById("logoText").innerHTML = n.length > 1 ? n.slice(0, -1) + "<i>" + n.slice(-1) + "</i>" : n;
  document.getElementById("slogan").textContent = B.slogan;
  document.getElementById("mo").innerHTML = CueArt.mascot({ cup: true });

  // background
  var bg = document.getElementById("bg"), html = "";
  [["#FFB020", 300, "-6%", "8%", 0], ["#E8364F", 240, "78%", "62%", -4], ["#6A9467", 200, "70%", "-4%", -8], ["#9EC4C0", 220, "-5%", "70%", -2]].forEach(function (b) {
    html += '<div class="blob" style="background:' + b[0] + ';width:' + b[1] + 'px;height:' + b[1] + 'px;left:' + b[2] + ';top:' + b[3] + ';animation-delay:' + b[4] + 's"></div>';
  });
  ["🥭:8:20", "🍓:86:14", "🍌:5:55", "🫐:90:48", "🍑:14:86", "🥭:78:84", "🍓:44:4", "🍌:60:92"].forEach(function (f, i) {
    var p = f.split(":"); html += '<span class="fr" style="left:' + p[1] + '%;top:' + p[2] + '%;animation-delay:' + (-i * 1.7) + 's;animation-duration:' + (9 + i) + 's">' + p[0] + "</span>";
  });
  bg.innerHTML = html;

  // tilt on hover
  document.querySelectorAll(".door").forEach(function (d) {
    d.addEventListener("mousemove", function (e) {
      var r = d.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
      d.style.transform = "translateY(-10px) rotateX(" + (-y * 10) + "deg) rotateY(" + (x * 12) + "deg)";
    });
    d.addEventListener("mouseleave", function () { d.style.transform = ""; });
  });

  // QR
  // No "scan with your phone" QR when you're already on a phone or tablet; the card just opens the app.
  var onPhone = window.matchMedia("(hover: none) and (pointer: coarse)").matches || window.matchMedia("(max-width: 760px)").matches;
  if (!onPhone && location.protocol !== "file:" && window.qrcode) {
    try {
      var url = new URL("order/index.html", location.href).href;
      var q = qrcode(0, "M"); q.addData(url); q.make();
      document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      document.getElementById("qrBox").classList.add("on");
    } catch (e) { console.warn("[qr]", e); }
  }
})();
</script>
</body>
</html>
