<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CUE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="shared/base.css">
<style>
/* Hub — charcoal sticker ground; sticker logo with Cuethie beside it; three paper cards. */
html, body { min-height: 100%; overflow-x: hidden; }
.hub {
  position: relative; min-height: 100vh; min-height: 100dvh;
  padding: 48px 16px 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  isolation: isolate; overflow: clip;
}
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; max-width: 980px; width: 100%; }
/* logo, then the heavy "Smoothie" wordmark and the slogan beside it; Cuethie stands at the end */
.lockup { display: flex; align-items: center; justify-content: center; gap: clamp(16px, 2.4vw, 32px); }
.logo-sticker { height: clamp(170px, 25vw, 310px); width: auto; display: block; flex: 0 0 auto; }
.wordmark { text-align: left; }
.wordmark h1 { font: 400 clamp(38px, 6vw, 80px)/.95 var(--font-slab); color: var(--peach); letter-spacing: .005em; margin: 0; }
.wordmark .slogan { font: italic 500 clamp(18px, 2.6vw, 28px) var(--font-display); color: var(--text-on-dark-soft); margin: 10px 0 0; }
.mo { width: clamp(84px, 9vw, 120px); flex: 0 0 auto; align-self: flex-end; }
.mo:empty { display: none; }
.mo svg { width: 100%; height: auto; display: block; overflow: visible; }
.tagline { margin: 22px 0 0; font-size: clamp(15px, 1.9vw, 18px); font-weight: 500; color: var(--text-on-dark-soft); max-width: 34em; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* The three entries: paper "label" cards with the logo's inner ring, side by side, stacked on mobile */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; width: 100%; max-width: 1020px; margin-top: 48px; }
.card {
  position: relative; isolation: isolate;
  display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
  padding: 28px 24px 24px; border-radius: 22px;
  background: var(--charcoal-2); color: var(--text-on-dark);
  border: 1px solid var(--rule); text-decoration: none; min-width: 0;
  transition: transform .28s cubic-bezier(.2,.7,.2,1), background-color .28s, border-color .28s;
}
.card::before { /* the logo sticker's thin inner ring, in peach */
  content: ""; position: absolute; inset: 7px; border-radius: 16px; border: 1px solid var(--rule); pointer-events: none; z-index: -1;
  transition: border-color .28s;
}
.card::after { /* four-point sparkle from the logo, top right */
  content: ""; position: absolute; top: 22px; right: 22px; width: 16px; height: 16px; opacity: .6; pointer-events: none;
  background: var(--peach); -webkit-mask: var(--spark) center/contain no-repeat; mask: var(--spark) center/contain no-repeat;
  transition: transform .5s cubic-bezier(.2,.7,.2,1), background-color .28s, opacity .28s;
}
:root { --spark: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z'/></svg>"); }
.card:hover, .card:focus-visible { transform: translateY(-6px); background: var(--charcoal-3); border-color: rgba(242,217,194,.4); }
.card:hover::before, .card:focus-visible::before { border-color: var(--straw); }
.card:hover::after, .card:focus-visible::after { transform: rotate(90deg) scale(1.35); background: var(--straw); opacity: 1; }
.card:active { transform: translateY(-2px); }
.card:focus-visible { outline: 2px solid var(--peach); outline-offset: 4px; }
/* logo-style line badge: peach shapes on charcoal, thin peach ring */
.ic { width: 64px; height: 64px; border-radius: 50%; background: var(--charcoal); border: 1px solid var(--rule); display: grid; place-items: center; color: var(--peach); flex: 0 0 auto; transition: transform .35s cubic-bezier(.2,.7,.2,1), border-color .28s; }
.ic svg { width: 38px; height: 38px; display: block; }
.card:hover .ic, .card:focus-visible .ic { transform: rotate(-6deg) scale(1.08); border-color: var(--peach); }
.card h2 { font-size: clamp(24px, 2.6vw, 30px); line-height: 1.15; color: var(--peach); }
.card > p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--text-on-dark-soft); }
.card .btn { margin-top: auto; transition: background-color .18s, transform .28s; }
.card:hover .btn { background: #9E2F28; transform: translateX(4px); }

/* One quick entrance once the wordmark font is ready: Smoothie types in, slogan follows, then the monkey, then the cards. */
.js .wm-l, .js .slogan .sw, .js .card, .js .mo { opacity: 0; }
.js .wm-l { display: inline-block; transform: translateY(.25em); }
.js .slogan .sw { display: inline-block; white-space: pre; }
.js .card { transform: translateY(14px); }
.js .mo { transform: translateY(10px); }
.go .wm-l { animation: wm-in .18s steps(3, end) forwards; animation-delay: calc(var(--i) * .035s); }
.go .slogan .sw { animation: sw-in .3s ease-out forwards; animation-delay: calc(.32s + var(--i) * .07s); }
.go .mo { animation: mo-in .45s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: .75s; }
.go .card { animation: card-in .4s cubic-bezier(.2,.7,.2,1) forwards; animation-delay: calc(.6s + var(--n) * .09s); }
.js .logo-sticker { animation: fade-in .3s ease-out both; }
@keyframes wm-in { to { opacity: 1; transform: none; } }
@keyframes sw-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
@keyframes mo-in { to { opacity: 1; transform: none; } }
@keyframes card-in { to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .js .wm-l, .js .slogan .sw, .js .card, .js .logo-sticker, .js .mo { opacity: 1 !important; transform: none !important; animation: none !important; }
}

/* QR for the order card (desktop only): small, quiet, above the button */
.qr { display: none; align-items: center; gap: 10px; }
.qr.on { display: flex; }
.qr #qr svg, .qr #qr img { width: 84px; height: 84px; display: block; background: var(--paper-2); border-radius: 6px; padding: 5px; }
.qr small { font-size: 12px; color: var(--text-on-dark-soft); font-weight: 500; line-height: 1.3; }

@media (max-width: 800px) {
  .cards { grid-template-columns: 1fr; max-width: 460px; }
}
@media (max-width: 560px) {
  .hero { padding-inline: 0; }
  .lockup { flex-direction: column; gap: 14px; } .mo { align-self: center; width: 96px; } .wordmark { text-align: center; }
  .qr.on { display: none; }  /* the card opens directly on a phone; no QR needed */
}
</style>
</head>
<body>
<script>document.documentElement.classList.add("js")</script>
<div class="hub dark on-dark grain">
  <header class="hero">
    <div class="lockup">
      <img class="logo-sticker" src="assets/img/cue-logo.png" alt="CUE logo: a cream smoothie cup with a striped straw on a charcoal oval">
      <div class="wordmark">
        <h1 id="wm"><span class="vh">CUE </span><span aria-hidden="true" id="wmText">Smoothie</span></h1>
        <p class="slogan" id="slogan"></p>
      </div>
      <div class="mo" id="mo" aria-hidden="true"></div>
    </div>
  </header>

  <nav class="cards" aria-label="CUE pages">
    <a class="card" href="site/index.html">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 48 48" fill="currentColor"><path d="M5 19 9.5 7h29L43 19Z"/><path d="M5 19a4.8 4.8 0 0 0 9.6 0 4.8 4.8 0 0 0 9.4 0 4.8 4.8 0 0 0 9.4 0 4.8 4.8 0 0 0 9.6 0Z" opacity=".75"/><path d="M9 25v16h30V25h-3v13H12V25Z"/><rect x="19" y="28" width="10" height="10" rx="1" opacity=".5"/></svg></span>
      <h2 class="display">View website</h2>
      <p>The menu, the survey behind it, and where to find the cart.</p>
      <span class="btn">Open the website</span>
    </a>
    <a class="card" href="order/index.html">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 48 48" fill="currentColor"><rect x="13" y="3" width="22" height="42" rx="5"/><rect x="16.5" y="9" width="15" height="27" rx="1.5" fill="#25292B"/><path d="M18.5 25c2-2.4 4-2.4 5.500 0s3.500 2.400 5.500 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M18.500 30c2-2.400 4-2.400 5.500 0s3.500 2.400 5.500 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M24 12.500l1 2.500 2.500 1-2.500 1-1 2.500-1-2.500-2.500-1 2.500-1Z"/><circle cx="24" cy="40.500" r="1.600" fill="#25292B"/></svg></span>
      <h2 class="display">Order on your phone</h2>
      <p>Build a smoothie in six taps and get a pickup ticket.</p>
      <span class="qr" id="qrBox"><span id="qr"></span><small>Scan to order<br>from your phone</small></span>
      <span class="btn">Open the order app</span>
    </a>
    <a class="card" href="deck/index.html">
      <span class="ic" aria-hidden="true"><svg viewBox="0 0 48 48" fill="currentColor"><rect x="5" y="6" width="38" height="25" rx="2.500"/><path d="M10 22c4-5 7-5 10.500-1.500S28 24 33 20s5-3 5-3" fill="none" stroke="#25292B" stroke-width="2.600" stroke-linecap="round"/><path d="M13 14h12" stroke="#25292B" stroke-width="2.600" stroke-linecap="round"/><path d="M24 31v6M24 37l-8 8M24 37l8 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
      <h2 class="display">View pitch</h2>
      <p>The animated deck, from seed to cup.</p>
      <span class="btn">Open the pitch</span>
    </a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="content/brand.js"></script>
<script src="content/menu.js"></script>
<script src="shared/art.js"></script>
<script>
(function () {
  var B = window.CONTENT.brand;
  document.title = B.name + " - " + B.slogan;
  var sl = document.getElementById("slogan"); sl.setAttribute("aria-label", B.slogan);
  sl.innerHTML = B.slogan.split(" ").map(function (w, i) { return '<span class="sw" aria-hidden="true" style="--i:' + i + '">' + w + (i < B.slogan.split(" ").length - 1 ? " " : "") + "</span>"; }).join("");
  var wt = document.getElementById("wmText");
  wt.innerHTML = wt.textContent.split("").map(function (c, i) { return '<span class="wm-l" style="--i:' + i + '">' + c + "</span>"; }).join("");
  // start the entrance as soon as the slab font is ready (never wait more than 700 ms)
  var go = function () { document.documentElement.classList.add("go"); };
  try { Promise.race([document.fonts.load('1em "Alfa Slab One"'), new Promise(function (r) { setTimeout(r, 700); })]).then(go, go); } catch (e) { go(); }
  Array.prototype.forEach.call(document.querySelectorAll(".card"), function (c, n) { c.style.setProperty("--n", n); });
  // Cuethie, standing still (boil.js does the only motion).
  var mo = document.getElementById("mo");
  if (window.CueArt) mo.innerHTML = CueArt.mascot();

  // QR for the order card.
  // No "scan with your phone" QR when you're already on a phone or tablet; the card just opens the app.
  var onPhone = window.matchMedia("(hover: none) and (pointer: coarse)").matches || window.matchMedia("(max-width: 760px)").matches;
  if (!onPhone && location.protocol !== "file:" && window.qrcode) {
    try {
      var url = new URL("order/index.html", location.href).href;
      var q = qrcode(0, "M"); q.addData(url); q.make();
      document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      document.getElementById("qrBox").classList.add("on");
    } catch (e) { console.warn("[qr]", e); }
  }
})();
</script>
</body>
</html>
