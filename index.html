<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CUE</title>
<link rel="stylesheet" href="shared/base.css">
<style>
/* Hub — charcoal sticker ground; sticker logo with Cuethie beside it; three paper cards. */
html, body { min-height: 100%; overflow-x: hidden; }
.hub {
  position: relative; min-height: 100vh; min-height: 100dvh;
  padding: 48px 16px 56px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  isolation: isolate; overflow: clip;
}
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; max-width: 720px; }
.lockup { display: flex; align-items: flex-end; justify-content: center; gap: 24px; flex-wrap: wrap; }
.mo { width: clamp(96px, 15vw, 150px); flex: 0 0 auto; }
.mo:empty { display: none; }
.mo svg { width: 100%; height: auto; display: block; overflow: visible; }
.logo-sticker { height: clamp(150px, 26vw, 280px); width: auto; display: block; }
.slogan { font: italic 500 clamp(19px, 3.4vw, 30px) var(--font-display); color: var(--text-on-dark-soft); margin: 14px 0 0; }
.tagline { margin: 10px 0 0; font-size: clamp(15px, 1.9vw, 18px); font-weight: 500; color: var(--text-on-dark-soft); max-width: 34em; }

/* The three entries: paper cards side by side, stacked on mobile */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; width: 100%; max-width: 1020px; margin-top: 48px; }
.card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
  padding: 24px 22px; border-radius: var(--radius-lg);
  background: var(--paper); color: var(--text-on-light);
  border: 1px solid var(--rule-ink); text-decoration: none; min-width: 0;
}
.card-img { height: 120px; width: auto; align-self: center; object-fit: contain; display: block; }
.card h2 { font-size: clamp(24px, 2.6vw, 30px); line-height: 1.15; }
.card > p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--text-on-light-soft); }
.card .btn { margin-top: auto; }

/* QR for the order card (desktop only): small, quiet, above the button */
.qr { display: none; align-items: center; gap: 10px; }
.qr.on { display: flex; }
.qr #qr svg, .qr #qr img { width: 84px; height: 84px; display: block; background: var(--paper-2); border-radius: 6px; padding: 5px; }
.qr small { font-size: 12px; color: var(--text-on-light-soft); font-weight: 500; line-height: 1.3; }

@media (max-width: 800px) {
  .cards { grid-template-columns: 1fr; max-width: 460px; }
}
@media (max-width: 560px) {
  .hero { padding-inline: 0; }
  .card-img { height: 104px; }
  .qr.on { display: none; }  /* the card opens directly on a phone; no QR needed */
}
</style>
</head>
<body>
<div class="hub dark on-dark grain">
  <header class="hero">
    <div class="lockup">
      <div class="mo boil" id="mo" aria-hidden="true"></div>
      <h1 class="display" id="logoTitle">
        <img class="logo-sticker boil" src="assets/img/cue-logo.png"
             alt="CUE — a cream smoothie cup with striped straw and sparkles on a dark charcoal oval sticker"
             onerror="this.classList.remove('boil');document.getElementById('logoTitle').textContent='CUE'">
      </h1>
    </div>
    <p class="slogan" id="slogan"></p>
    <p class="tagline" id="tagline"></p>
  </header>

  <nav class="cards" aria-label="CUE pages">
    <a class="card" href="site/index.html">
      <img class="card-img" src="assets/img/drinks/mango.png"
           alt="CUE cup of the mango sunrise smoothie" loading="lazy">
      <h2 class="display">View website</h2>
      <p>The menu, the survey behind it, and where to find the cart.</p>
      <span class="btn">Open the website</span>
    </a>
    <a class="card" href="order/index.html">
      <img class="card-img" src="assets/img/drinks/berry-layers.png"
           alt="CUE cup of the layered berry and yogurt smoothie" loading="lazy">
      <h2 class="display">Order on your phone</h2>
      <p>Build a smoothie in six taps and get a pickup ticket.</p>
      <span class="qr" id="qrBox"><span id="qr"></span><small>Scan to order<br>from your phone</small></span>
      <span class="btn">Open the order app</span>
    </a>
    <a class="card" href="deck/index.html">
      <img class="card-img" src="assets/img/drinks/matcha.png"
           alt="CUE cup of the matcha banana smoothie" loading="lazy">
      <h2 class="display">View pitch</h2>
      <p>The animated deck, from seed to cup.</p>
      <span class="btn">Open the pitch</span>
    </a>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="content/brand.js"></script>
<script src="content/menu.js"></script>
<script src="shared/art.js"></script>
<script src="shared/boil.js"></script>
<script>
(function () {
  var B = window.CONTENT.brand;
  document.title = B.name + " - " + B.slogan;
  document.getElementById("slogan").textContent = B.slogan;
  document.getElementById("tagline").textContent = B.tagline;
  // Cuethie, holding the cup; standing still (boil.js does the only motion).
  var mo = document.getElementById("mo");
  if (window.CueArt) mo.innerHTML = CueArt.mascot({ cup: true });

  // QR for the order card.
  // No "scan with your phone" QR when you're already on a phone or tablet; the card just opens the app.
  var onPhone = window.matchMedia("(hover: none) and (pointer: coarse)").matches || window.matchMedia("(max-width: 760px)").matches;
  if (!onPhone && location.protocol !== "file:" && window.qrcode) {
    try {
      var url = new URL("order/index.html", location.href).href;
      var q = qrcode(0, "M"); q.addData(url); q.make();
      document.getElementById("qr").innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      document.getElementById("qrBox").classList.add("on");
    } catch (e) { console.warn("[qr]", e); }
  }
})();
</script>
</body>
</html>
