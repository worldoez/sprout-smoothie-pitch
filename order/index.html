<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#25292B">
<meta name="description" content="CUE — order ahead. Fresh smoothies for CUHK, picked up at YIA.">
<title>CUE · order ahead</title>
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="order.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="app">
      <header class="top">
        <a class="brand brandmark" href="../index.html" aria-label="CUE home page">
          <img src="../assets/img/cue-logo.png" alt="CUE — smoothie cup logo" class="boil" onerror="this.parentNode.classList.add('txt')">
          <span class="bm-text display">CUE</span>
        </a>
      </header>
      <main class="screens" id="screens"></main>
      <nav class="tabs" id="tabs" aria-label="Main">
        <button type="button" class="tab on" data-tab="home" aria-label="Home">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5 12 4l8.5 7.5"/><path d="M6 10.5V20h4.5v-5h3V20H18v-9.5"/></svg>
          <span>Home</span>
        </button>
        <button type="button" class="tab" data-tab="menu" aria-label="Menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 9h13l-1.6 11H7.1L5.5 9Z"/><path d="M4 9h16"/><path d="M13 9l2-5"/><path d="M8.5 13h7"/></svg>
          <span>Menu</span>
        </button>
        <button type="button" class="tab" data-tab="bag" aria-label="Bag">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8h13l1 12h-15l1-12Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
          <span>Bag</span>
          <em class="badge" id="bagBadge" hidden>0</em>
        </button>
        <button type="button" class="tab" data-tab="me" aria-label="Me">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1.2-3.6 3.8-5.2 7-5.2s5.8 1.6 7 5.2"/></svg>
          <span>Me</span>
        </button>
      </nav>
    </div>
    <div class="sheet-host" id="sheetHost" hidden>
      <div class="backdrop" id="sheetBackdrop"></div>
      <section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="../content/brand.js"></script>
<script src="../content/menu.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="../shared/relay.js"></script>
<script src="../shared/orders.js"></script>
<script src="../shared/art.js"></script>
<script src="../shared/boil.js"></script>
<script src="order.js"></script>
</body>
</html>
